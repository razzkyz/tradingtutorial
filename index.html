<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Trade Smarter. Move Faster. Professional trading platform with real-time market data." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Roboto:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
    
    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://s3.tradingview.com" crossorigin />
    <link rel="dns-prefetch" href="https://s3.tradingview.com" />
    
    <!-- Preload critical assets -->
    <link rel="preload" href="/images/logo.png" as="image" />
    
    <title>Trading Tutorials - Trade Smarter. Move Faster.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker for caching -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .catch(() => {
              // Silent fail - not critical
            });
        });
      }
    </script>
  </body>
</html>
